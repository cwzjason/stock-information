# ============================================================
#  美股监控 · GitHub Actions 定时任务
#  - cron 用的是 UTC 时间；推送里显示的时间由脚本内 MONITOR_TZ 决定
#  - 需要的 Secrets：WECOM_WEBHOOK_URL / SUPABASE_URL / SUPABASE_KEY
# ============================================================
name: US Market Monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # 每 5 分钟（GitHub 最短粒度）
    - cron: "17 3 * * *"     # 每天 UTC 03:17 触发一次 heartbeat
  workflow_dispatch:         # 可在 Actions 页面手动点一次，用来验证配置

concurrency:
  group: us-market-monitor
  cancel-in-progress: false  # 上一次没跑完就排队，避免并发导致重复推送

permissions:
  contents: write            # heartbeat 需要提交

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      MONITOR_TZ: Asia/Shanghai
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python backend/us_market_monitor.py --once

  # GitHub 会禁用「60 天内无任何活动」的仓库的定时任务。
  # 这里每天提交一个时间戳保持仓库活跃；不需要可以整个删掉。
  heartbeat:
    if: github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep repository active
        run: |
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last_active.txt
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/heartbeat/last_active.txt
          git diff --quiet --cached || git commit -m "chore: heartbeat"
          git push
